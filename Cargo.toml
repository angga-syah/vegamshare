[workspace]
resolver = "3"
members = ["core", "cli", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

# Crypto and hashing are painfully slow unoptimized; keep our own code debuggable.
[profile.dev.package."*"]
opt-level = 2
