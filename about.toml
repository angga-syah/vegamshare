# Licenses accepted for dependencies shipped in VegamShare binaries.
accepted = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "Unlicense", "CC0-1.0", "MIT-0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["x86_64-pc-windows-msvc", "aarch64-linux-android"]

# allo-isolate ships an Apache-2.0 LICENSE file but no license field.
[allo-isolate.clarify]
license = "Apache-2.0"
[[allo-isolate.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4"
