[package]
name = "vegamshare_bridge"
license = "MIT"
publish = false
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
log = "0.4.34"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
vegamshare-core = { version = "0.1.0", path = "../../core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
