[package]
name = "vegamshare-core"
license = "MIT"
publish = false
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
getrandom = "0.3"
hex = "0.4.3"
hmac = "0.12"
if-addrs = "0.15.0"
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio", "log"] }
rcgen = { version = "0.14.10", features = ["ring", "pem"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
socket2 = { version = "0.6.5", features = ["all"] }
spake2 = "0.4.0"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tracing = "0.1.44"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
